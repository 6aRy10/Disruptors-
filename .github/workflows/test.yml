name: test

on:
  push:
    branches:
      - main
      - feat/**
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: Disruptors
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d Disruptors"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/Disruptors

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Validate seed data
        run: python scripts/validate_seed_data.py

      - name: Load PostgreSQL/PostGIS seed
        run: python scripts/load_seed_data.py

      - name: Test enterprise data scale
        run: python -m unittest tests.test_data_scale -v

      - name: Test enterprise graph indexes
        run: python -m unittest tests.test_scale_indexes -v

      - name: Test network and hidden dependencies
        run: python -m unittest tests.test_network_and_dependencies -v

      - name: Test network graph views
        run: python -m unittest tests.test_network_views -v

      - name: Test judge dashboard snapshot
        run: python -m unittest tests.test_dashboard -v

      - name: Test ground truth
        run: python -m unittest tests.test_ground_truth -v

      - name: Test database impact
        run: python -m unittest tests.test_db_impact -v

      - name: Test recovery
        run: python -m unittest tests.test_recovery -v

      - name: Test deterministic core
        run: python -m unittest tests.test_final -v

      - name: Test agent runtime argument recovery
        run: python -m unittest tests.test_agent_runtime_arguments -v

      - name: Test agent contracts
        run: python -m unittest tests.test_agents -v

      - name: Agent tool - BOM explosion
        run: python -m unittest tests.test_agent_tools_data.AgentDataToolTests.test_bom_explosion_is_deterministic -v

      - name: Agent tool - inventory
        run: python -m unittest tests.test_agent_tools_data.AgentDataToolTests.test_inventory_reports_usable_stock_without_safety_stock -v

      - name: Agent tool - upstream trace
        run: python -m unittest tests.test_agent_tools_data.AgentDataToolTests.test_upstream_trace_uses_explicit_allocations -v

      - name: Agent tool - company normalization returns candidates
        run: python -m unittest tests.test_agent_tools_data.AgentDataToolTests.test_company_normalization_returns_candidates -v

      - name: Agent tool - company normalization exact priority
        run: python -m unittest tests.test_agent_tools_data.AgentDataToolTests.test_company_normalization_prioritizes_exact_match -v

      - name: Agent tool - company normalization demo supplier
        run: python -m unittest tests.test_agent_tools_data.AgentDataToolTests.test_company_normalization_keeps_demo_supplier_in_results -v

      - name: Agent tool - transport options
        run: python -m unittest tests.test_agent_tools_data.AgentDataToolTests.test_transport_options_are_data_driven -v

      - name: Agent tool - approved alternatives
        run: python -m unittest tests.test_agent_tools_data.AgentDataToolTests.test_approved_alternatives_do_not_promote_unapproved_substitute -v

      - name: Agent tool - event evidence
        run: python -m unittest tests.test_agent_tools_data.AgentDataToolTests.test_event_evidence_keeps_proximity_as_potential_only -v

      - name: Test operational memory
        run: python -m unittest tests.test_memory -v

      - name: Test transactional event bus
        run: python -m unittest tests.test_event_bus -v

      - name: Test Aiven Kafka transport contract
        run: python -m unittest tests.test_kafka_contract -v

      - name: Test judge-editable operational state
        run: python -m unittest tests.test_judge_edits -v

      - name: Generalization - generated facility fixture
        run: python -m unittest tests.test_dehardcoding.DehardcodingTests.test_generated_facility_has_products_and_coordinates -v

      - name: Generalization - generated facility public-network link
        run: python -m unittest tests.test_dehardcoding.DehardcodingTests.test_generated_facility_has_public_network_link -v

      - name: Generalization - public radius returns generated node
        run: python -m unittest tests.test_dehardcoding.DehardcodingTests.test_public_radius_query_returns_generated_network_node -v

      - name: Generalization - public radius preserves operational link
        run: python -m unittest tests.test_dehardcoding.DehardcodingTests.test_public_radius_query_preserves_generated_operational_link -v

      - name: Generalization - generated facility geospatial lookup
        run: python -m unittest tests.test_dehardcoding.DehardcodingTests.test_arbitrary_new_event_finds_generated_facility_geospatially -v

      - name: Generalization - arbitrary new event
        run: python -m unittest tests.test_dehardcoding.DehardcodingTests.test_arbitrary_new_earthquake_reaches_generated_private_graph -v

      - name: Generalization - no-network event
        run: python -m unittest tests.test_dehardcoding.DehardcodingTests.test_arbitrary_ocean_event_does_not_create_fake_business_impact -v

      - name: Test de-hardcoding
        run: python -m unittest tests.test_dehardcoding -v

      - name: Test enterprise-scale private twin
        run: python -m unittest tests.test_enterprise_scale -v

      - name: Test shared backup portfolio safety
        run: python -m unittest tests.test_shared_backup_safety -v

      - name: Test portfolio recovery
        run: python -m unittest tests.test_portfolio -v

      - name: Test component feasibility
        run: python -m unittest tests.test_component_feasibility -v

      - name: Test local event orchestration
        run: python -m unittest tests.test_automation -v

      - name: Test human approval workflow
        run: python -m unittest tests.test_approvals -v

      - name: Test approved action execution
        run: python -m unittest tests.test_execution -v

      - name: Test supplier outreach workflow
        run: python -m unittest tests.test_supplier_outreach -v

      - name: Test event-type exposure engines
        run: python -m unittest tests.test_event_types -v

      - name: Test PortWatch normalization
        run: python -m unittest tests.test_portwatch -v

      - name: Test transport feasibility
        run: python -m unittest tests.test_transport_feasibility -v

      - name: Test recovery optimization
        run: python -m unittest tests.test_optimization -v
