name: test

on:
  push:
    branches:
      - main
      - feat/**
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: Disruptors
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d Disruptors"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/Disruptors

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Test read-only Aiven broker and topic readiness
        run: python -m unittest tests.test_aiven_network_probe -v

      - name: Test Aiven free-tier safety preflight
        run: python -m unittest tests.test_aiven_preflight -v

      - name: Test single-command team data readiness report
        run: python -m unittest tests.test_team_status -v

      - name: Test database readiness diagnostics
        run: python -m unittest tests.test_doctor -v

      - name: Validate seed data
        run: python scripts/validate_seed_data.py

      - name: Load PostgreSQL/PostGIS seed
        run: python scripts/load_seed_data.py

      - name: Verify investigation schema migrations are repeatable
        run: |
          python -m scripts.apply_migrations
          python -m scripts.apply_migrations

      - name: Validate dashboard JavaScript syntax
        run: node --check web/app.js

      - name: Test enterprise data scale
        run: python -m unittest tests.test_data_scale -v

      - name: Test enterprise graph indexes
        run: python -m unittest tests.test_scale_indexes -v

      - name: Test network and hidden dependencies
        run: python -m unittest tests.test_network_and_dependencies -v

      - name: Test network graph views
        run: python -m unittest tests.test_network_views -v

      - name: Test full PostgreSQL backup transfer safety
        run: python -m unittest tests.test_full_team_database_export -v

      - name: Test safe team data snapshot export
        run: python -m unittest tests.test_team_model_export -v

      - name: Test local readiness and safe DB diagnostic
        run: python -m unittest tests.test_local_readiness -v

      - name: Test Hermes map and facility profile contracts
        run: python -m unittest tests.test_app_data_contracts -v

      - name: Test Hermes world map and facility drilldown against PostgreSQL
        run: python -m unittest tests.test_app_data_db -v

      - name: Test unresolved events stay visible in dashboard feed
        run: python -m unittest tests.test_open_incident_feed -v

      - name: Test judge dashboard snapshot
        run: python -m unittest tests.test_dashboard -v

      - name: Test ground truth
        run: python -m unittest tests.test_ground_truth -v

      - name: Test database impact
        run: python -m unittest tests.test_db_impact -v

      - name: Test recovery
        run: python -m unittest tests.test_recovery -v

      - name: Test deterministic core
        run: python -m unittest tests.test_final -v

      - name: Test agent runtime argument recovery
        run: python -m unittest tests.test_agent_runtime_arguments -v

      - name: Test evidence agent can only draft review requests
        run: python -m unittest tests.test_evidence_agent -v

      - name: Test agent contracts
        run: python -m unittest tests.test_agents -v

      - name: Agent tool - BOM explosion
        run: python -m unittest tests.test_agent_tools_data.AgentDataToolTests.test_bom_explosion_is_deterministic -v

      - name: Agent tool - inventory
        run: python -m unittest tests.test_agent_tools_data.AgentDataToolTests.test_inventory_reports_usable_stock_without_safety_stock -v

      - name: Agent tool - upstream trace
        run: python -m unittest tests.test_agent_tools_data.AgentDataToolTests.test_upstream_trace_uses_explicit_allocations -v

      - name: Agent tool - company normalization returns candidates
        run: python -m unittest tests.test_agent_tools_data.AgentDataToolTests.test_company_normalization_returns_candidates -v

      - name: Agent tool - company normalization exact priority
        run: python -m unittest tests.test_agent_tools_data.AgentDataToolTests.test_company_normalization_prioritizes_exact_match -v

      - name: Agent tool - company normalization demo supplier
        run: python -m unittest tests.test_agent_tools_data.AgentDataToolTests.test_company_normalization_keeps_demo_supplier_in_results -v

      - name: Agent tool - transport options
        run: python -m unittest tests.test_agent_tools_data.AgentDataToolTests.test_transport_options_are_data_driven -v

      - name: Agent tool - approved alternatives
        run: python -m unittest tests.test_agent_tools_data.AgentDataToolTests.test_approved_alternatives_do_not_promote_unapproved_substitute -v

      - name: Agent tool - event evidence
        run: python -m unittest tests.test_agent_tools_data.AgentDataToolTests.test_event_evidence_keeps_proximity_as_potential_only -v

      - name: Test operational memory
        run: python -m unittest tests.test_memory -v

      - name: Test single-topic free Kafka routing
        run: python -m unittest tests.test_kafka_free_routing -v

      - name: Test Kafka settings (project and Aiven Runtime variables, TLS fail-closed)
        run: python -m unittest tests.test_kafka_settings -v

      - name: Test outbox publisher, consumer loop and relay worker
        run: python -m unittest tests.test_kafka_transport -v

      - name: Test secret-free Kafka health endpoints
        run: python -m unittest tests.test_kafka_health -v

      - name: Test Kafka round-trip verifier
        run: python -m unittest tests.test_kafka_roundtrip -v

      - name: Test transactional event bus
        run: python -m unittest tests.test_event_bus -v

      - name: Test local and Kafka transport identity
        run: python -m unittest tests.test_transport_consistency -v

      - name: Test Aiven Kafka transport contract
        run: python -m unittest tests.test_kafka_contract -v

      - name: Test judge-editable operational state
        run: python -m unittest tests.test_judge_edits -v

      - name: Generalization - generated facility fixture
        run: python -m unittest tests.test_dehardcoding.DehardcodingTests.test_generated_facility_has_products_and_coordinates -v

      - name: Generalization - generated facility public-network link
        run: python -m unittest tests.test_dehardcoding.DehardcodingTests.test_generated_facility_has_public_network_link -v

      - name: Generalization - public radius returns generated node
        run: python -m unittest tests.test_dehardcoding.DehardcodingTests.test_public_radius_query_returns_generated_network_node -v

      - name: Generalization - public radius preserves operational link
        run: python -m unittest tests.test_dehardcoding.DehardcodingTests.test_public_radius_query_preserves_generated_operational_link -v

      - name: Generalization - generated facility geospatial lookup
        run: python -m unittest tests.test_dehardcoding.DehardcodingTests.test_arbitrary_new_event_finds_generated_facility_geospatially -v

      - name: Generalization - arbitrary new event
        run: python -m unittest tests.test_dehardcoding.DehardcodingTests.test_arbitrary_new_earthquake_reaches_generated_private_graph -v

      - name: Generalization - no-network event
        run: python -m unittest tests.test_dehardcoding.DehardcodingTests.test_arbitrary_ocean_event_does_not_create_fake_business_impact -v

      - name: Test de-hardcoding
        run: python -m unittest tests.test_dehardcoding -v

      - name: Test enterprise-scale private twin
        run: python -m unittest tests.test_enterprise_scale -v

      - name: Test shared backup portfolio safety
        run: python -m unittest tests.test_shared_backup_safety -v

      - name: Test portfolio recovery
        run: python -m unittest tests.test_portfolio -v

      - name: Test component feasibility
        run: python -m unittest tests.test_component_feasibility -v

      - name: Test deterministic runner without AI import dependencies
        run: python -m unittest tests.test_live_stack_imports -v

      - name: Test independent NASA FIRMS satellite observations
        run: python -m unittest tests.test_firms_source -v

      - name: Test source receipts and live feed truthfulness
        run: python -m unittest tests.test_activity_stream tests.test_collector_poll_receipts -v

      - name: Test unified live ingestion and orchestration
        run: python -m unittest tests.test_live_stack -v

      - name: Test real database event evidence confirmation and replanning
        timeout-minutes: 4
        run: python -m unittest tests.test_live_evidence_to_recovery -v

      - name: Trace recorded event through investigation evidence
        id: journey_e2e
        shell: bash
        env:
          HERMES_CI_DISPOSABLE_DB: "1"
        run: |
          set +e
          python -m unittest tests.test_event_journey_e2e.EventJourneyIntegration.test_unfamiliar_event_records_entire_explainable_lifecycle -v > /tmp/hermes_journey_test.log 2>&1
          outcome=$?
          if [ "$outcome" -ne 0 ]; then
            issue=$(grep -E 'AssertionError:|ValueError:|TypeError:|KeyError:|AttributeError:|psycopg.errors.|test_event_journey_e2e.py.*, line ' /tmp/hermes_journey_test.log | tail -n 2 | tr '\\n' ' ' | cut -c 1-150)
            issue=$(printf '%s' "$issue" | tr -cd '[:alnum:] .,/_:-')
            echo "issue=$issue" >> "$GITHUB_OUTPUT"
          fi
          cat /tmp/hermes_journey_test.log
          exit "$outcome"

      - name: "Journey debug ${{ steps.journey_e2e.outputs.issue }}"
        if: failure()
        run: echo "See the source-to-evidence test output above."

      - name: Trace non-exposed event without invented incident
        env:
          HERMES_CI_DISPOSABLE_DB: "1"
        run: python -m unittest tests.test_event_journey_e2e.EventJourneyIntegration.test_remote_event_stops_without_invented_incident -v

      - name: Reject unknown event trace
        env:
          HERMES_CI_DISPOSABLE_DB: "1"
        run: python -m unittest tests.test_event_journey_e2e.EventJourneyIntegration.test_unknown_event_is_not_silently_created -v

      - name: Test unscripted event creates persisted investigation queue
        run: python -m unittest tests.test_live_investigation_db -v

      - name: Test persisted evidence outreach drafts against PostgreSQL
        run: python -m unittest tests.test_outreach_db -v

      - name: Test evidence outreach draft safety
        run: python -m unittest tests.test_outreach_drafts -v

      - name: Test legacy investigation reconciliation safety
        run: python -m unittest tests.test_reconcile_investigations -v

      - name: Test live-incident task reconciliation against PostgreSQL
        run: python -m unittest tests.test_reconcile_investigations_db -v

      - name: Test live evidence task construction
        run: python -m unittest tests.test_investigation_tasks tests.test_live_investigation -v

      - name: Test cross-SKU invalidation and portfolio replanning
        run: python -m unittest tests.test_portfolio_invalidation -v

      - name: Test local event orchestration
        run: python -m unittest tests.test_automation -v

      - name: Test explicit local versus Aiven database selection
        run: python -m unittest tests.test_db_target_selection -v

      - name: Test remote write authorization
        run: python -m unittest tests.test_write_guard -v

      - name: Test human approval workflow
        run: python -m unittest tests.test_approvals -v

      - name: Test approved action execution
        run: python -m unittest tests.test_execution -v

      - name: Test supplier outreach workflow
        run: python -m unittest tests.test_supplier_outreach -v

      - name: Test bounded IMF PortWatch live integration
        run: python -m unittest tests.test_portwatch_worker -v

      - name: Test live-event graph and queue inspection
        run: python -m unittest tests.test_event_inspection -v

      - name: Smoke-test event inspector CLI against seeded Cianjur data
        run: python -m scripts.inspect_event IDN-CIANJUR-2022-USGS-us7000ir9t

      - name: Test multi-source event provenance
        run: python -m unittest tests.test_event_provenance -v

      - name: Test event-type exposure engines
        run: python -m unittest tests.test_event_types -v

      - name: Test PortWatch normalization
        run: python -m unittest tests.test_portwatch -v

      - name: Test transport feasibility
        run: python -m unittest tests.test_transport_feasibility -v

      - name: Test facility-wide capacity confirmation against PostgreSQL
        run: python -m unittest tests.test_facility_capacity_db -v

      - name: Test dated confirmed facility-wide capacity
        run: python -m unittest tests.test_confirmed_facility_caps -v

      - name: Test shared upstream material contention
        run: python -m unittest tests.test_material_contention -v

      - name: Test measured mission latency summary
        run: python -m unittest tests.test_mission_benchmark -v

      - name: Test model specialist permission and read-only tool allowlists
        run: python -m unittest tests.test_mission_agents -v

      - name: Test mission supervisor recovery challenger and evidence gates
        run: python -m unittest tests.test_mission_controller -v

      - name: Prevent false supplier-to-order routing claims
        run: python -m unittest tests.test_expeditor_route_truth -v

      - name: Test supply graph edge projection
        run: python -m unittest tests.test_graph_source_projection -v

      - name: Test joint portfolio capacity optimization
        run: python -m unittest tests.test_joint_optimization -v

      - name: Test recovery optimization
        run: python -m unittest tests.test_optimization -v

      - name: Test rehearsal recovery data contract
        run: python -m unittest tests.test_rehearsal_contract -v

      - name: Rehearsal checkpoint - exposure and recovery
        run: python scripts/rehearse_control_loop.py --stop-after-stage 2

      - name: Rehearsal checkpoint - supplier capacity confirmation
        run: python scripts/rehearse_control_loop.py --stop-after-stage 4

      - name: Capture post-confirmation recovery error
        id: replan_probe
        shell: bash
        run: |
          if python scripts/rehearse_control_loop.py --stop-after-stage 5 --skip-event-worker > /tmp/dependency-replan.log 2>&1; then
            echo "result=PASS" >> "$GITHUB_OUTPUT"
            echo "reason=NONE" >> "$GITHUB_OUTPUT"
          else
            tail -n 35 /tmp/dependency-replan.log
            reason=$(tail -n 1 /tmp/dependency-replan.log | tr -cd '[:alnum:] _.,:=-' | cut -c 1-150)
            echo "result=FAIL" >> "$GITHUB_OUTPUT"
            echo "reason=$reason" >> "$GITHUB_OUTPUT"
          fi

      - name: "Post-confirmation exception ${{ steps.replan_probe.outputs.reason }}"
        run: test "${{ steps.replan_probe.outputs.result }}" = PASS

      - name: Rehearsal checkpoint - post-confirmation replanning
        run: python scripts/rehearse_control_loop.py --stop-after-stage 5

      - name: Rehearsal checkpoint - approval and execution
        run: python scripts/rehearse_control_loop.py --stop-after-stage 6

      - name: Rehearse full Cianjur control loop
        run: python scripts/rehearse_control_loop.py
