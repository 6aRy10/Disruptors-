name: test

on:
  push:
    branches:
      - main
      - feat/**
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: Disruptors
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d Disruptors"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/Disruptors

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Validate seed data
        run: python scripts/validate_seed_data.py

      - name: Load PostgreSQL/PostGIS seed
        run: python scripts/load_seed_data.py

      - name: Run tests
        run: python -m unittest discover -v
