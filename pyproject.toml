[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "disruptors-dependency"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.8",
  "confluent-kafka>=2.5",
  "psycopg[binary]>=3.2",
  "python-dotenv>=1.0",
  "openai>=1.66",
  "rapidfuzz>=3.10",
]

[tool.setuptools.packages.find]
where = ["src"]
