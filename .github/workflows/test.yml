name: test

on:
  push:
    branches:
      - main
      - feat/**
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: Disruptors
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d Disruptors"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/Disruptors

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Validate seed data
        run: python scripts/validate_seed_data.py

      - name: Load PostgreSQL/PostGIS seed
        run: python scripts/load_seed_data.py

      - name: Test network and hidden dependencies
        run: python -m unittest tests.test_network_and_dependencies -v

      - name: Test ground truth
        run: python -m unittest tests.test_ground_truth -v

      - name: Test database impact
        run: python -m unittest tests.test_db_impact -v

      - name: Test recovery
        run: python -m unittest tests.test_recovery -v

      - name: Test deterministic core
        run: python -m unittest tests.test_final -v

      - name: Test agent contracts
        run: python -m unittest tests.test_agents -v

      - name: Agent tool - BOM explosion
        run: python -m unittest tests.test_agent_tools_data.AgentDataToolTests.test_bom_explosion_is_deterministic -v

      - name: Agent tool - inventory
        run: python -m unittest tests.test_agent_tools_data.AgentDataToolTests.test_inventory_reports_usable_stock_without_safety_stock -v

      - name: Agent tool - upstream trace
        run: python -m unittest tests.test_agent_tools_data.AgentDataToolTests.test_upstream_trace_uses_explicit_allocations -v

      - name: Agent tool - company normalization returns candidates
        run: python -m unittest tests.test_agent_tools_data.AgentDataToolTests.test_company_normalization_returns_candidates -v

      - name: Agent tool - company normalization exact priority
        run: python -m unittest tests.test_agent_tools_data.AgentDataToolTests.test_company_normalization_prioritizes_exact_match -v

      - name: Agent tool - company normalization demo supplier
        run: python -m unittest tests.test_agent_tools_data.AgentDataToolTests.test_company_normalization_keeps_demo_supplier_in_results -v

      - name: Agent tool - transport options
        run: python -m unittest tests.test_agent_tools_data.AgentDataToolTests.test_transport_options_are_data_driven -v

      - name: Agent tool - approved alternatives
        run: python -m unittest tests.test_agent_tools_data.AgentDataToolTests.test_approved_alternatives_do_not_promote_unapproved_substitute -v

      - name: Agent tool - event evidence
        run: python -m unittest tests.test_agent_tools_data.AgentDataToolTests.test_event_evidence_keeps_proximity_as_potential_only -v

      - name: Test operational memory
        run: python -m unittest tests.test_memory -v

      - name: Test transactional event bus
        run: python -m unittest tests.test_event_bus -v

      - name: Test judge-editable operational state
        run: python -m unittest tests.test_judge_edits -v

      - name: Test de-hardcoding
        run: python -m unittest tests.test_dehardcoding -v

      - name: Test portfolio recovery
        run: python -m unittest tests.test_portfolio -v

      - name: Test component feasibility
        run: python -m unittest tests.test_component_feasibility -v

      - name: Test local event orchestration
        run: python -m unittest tests.test_automation -v

      - name: Test human approval workflow
        run: python -m unittest tests.test_approvals -v
